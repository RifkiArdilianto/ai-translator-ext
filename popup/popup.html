<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 15px;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select {
      width: 100%;
      padding: 8px;
      background-color: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    .note-section-title {
      font-size: 12px;
      font-weight: bold;
      color: #38bdf8;
      margin-top: 14px;
      margin-bottom: 8px;
    }
    .note-list {
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 12px;
      padding-right: 4px;
    }
    .note-item {
      background: #1e293b;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 12px;
      border: 1px solid #334155;
    }
    .note-orig {
      color: #94a3b8;
      font-style: italic;
      font-size: 11px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note-trans {
      color: #f8fafc;
      font-weight: 500;
      line-height: 1.3;
    }
    .btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      margin-top: 6px;
      transition: background-color 0.2s;
    }
    .btn-save-setting {
      background-color: #2563eb;
      color: white;
    }
    .btn-save-setting:hover {
      background-color: #1d4ed8;
    }
    .btn-view {
      background-color: #0284c7;
      color: white;
    }
    .btn-view:hover {
      background-color: #0369a1;
    }
    .btn-clear {
      background-color: #dc2626;
      color: white;
    }
    .btn-clear:hover {
      background-color: #b91c1c;
    }
    .empty-msg {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      padding: 15px 0;
      background: #1e293b;
      border-radius: 6px;
      border: 1px dashed #334155;
    }
    #status {
      margin-top: 6px;
      font-size: 11px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>AI Translator Extc</h3>

  <div class="field">
    <label for="targetLang">Bahasa Terjemahan</label>
    <select id="targetLang">
      <option value="id">Bahasa Indonesia</option>
      <option value="en">English</option>
      <option value="ja">Jepang</option>
    </select>
  </div>

  <button id="saveBtn" class="btn btn-save-setting">Simpan Pengaturan</button>
  <div id="status"></div>

  <div class="note-section-title">📚 Catatan Tersimpan</div>
  <div id="noteList" class="note-list">
    <div class="empty-msg">Belum ada catatan yang disimpan.</div>
  </div>

  <button id="exportPdfBtn" class="btn btn-view">👁️ Buka Halaman Catatan</button>
  <button id="clearBtn" class="btn btn-clear">🗑️ Hapus Semua Catatan</button>

  <script src="popup.js"></script>
</body>
</html>
