<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 15px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background-color: #ffffff;
    }
    h3 {
      margin-top: 0;
      font-size: 15px;
      color: #0f172a;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #475569;
    }
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 9px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>AI Translator Extc</h3>

  <div class="field">
    <label for="targetLang">Bahasa Terjemahan:</label>
    <select id="targetLang">
      <option value="id">Bahasa Indonesia</option>
      <option value="en">English</option>
      <option value="ja">Jepang</option>
    </select>
  </div>

  <button id="saveBtn">Simpan Pengaturan</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
